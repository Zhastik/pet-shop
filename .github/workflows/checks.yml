name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ecommerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce_user -d ecommerce_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ecommerce_user:test_password@localhost:5432/ecommerce_test
      SECRET_KEY: ci-only-secret-not-for-production-123456
      REDIS_URL: redis://localhost:6379/0
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy
      - run: alembic upgrade head
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: pytest --cov=app
      - run: bandit -r app -ll
      - run: pip-audit -r requirements.txt
      - uses: gitleaks/gitleaks-action@v2
      - run: docker build -t forma:test .
